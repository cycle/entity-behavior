---

on:  # yamllint disable-line rule:truthy
  pull_request: null
  push:
    branches:
      - 1.x

name: build

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sqlite:
    name: SQLite PHP ${{ matrix.php-version }}, ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"
        dependencies:
          - lowest
          - highest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          extensions: mbstring, pdo, pdo_sqlite

      - name: Install dependencies with composer
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Execute Tests
        env:
          DB: sqlite
        run: vendor/bin/phpunit --group driver-sqlite --colors=always

  test:
    needs: sqlite
    name: Test PHP ${{ matrix.php-version }} with Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"
    steps:
      - name: Install ODBC driver
        run: |
          sudo curl https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup DB services
        working-directory: tests
        run: docker compose up -d

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: pcov
          tools: pecl
          extensions: mbstring, pdo, pdo_sqlite, pdo_pgsql, pdo_sqlsrv, pdo_mysql

      - name: Install dependencies with composer
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest

      - name: Execute Tests
        run: vendor/bin/phpunit --coverage-clover=coverage.clover

      - name: Upload coverage to Codecov
        continue-on-error: true  # forks have no token
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.clover

...
