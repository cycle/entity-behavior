---

on:  # yamllint disable-line rule:truthy
  pull_request: null
  push:
    branches:
      - 1.x

name: build

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sqlite:
    name: Unit and SQLite, PHP ${{ matrix.php-version }}, ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"
        dependencies:
          - lowest
          - highest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          extensions: mbstring, pdo, pdo_sqlite

      - name: Install dependencies with composer
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Unit tests
        run: composer test:unit

      - name: SQLite tests
        env:
          DB_REQUIRED: 1
        run: composer test:sqlite

  coverage:
    needs: sqlite
    name: Code coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        dependencies:
          - highest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: pcov
          extensions: mbstring, pdo, pdo_sqlite

      - name: Install dependencies with composer
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Unit and SQLite tests with coverage
        env:
          DB_DRIVERS: sqlite
          DB_REQUIRED: 1
        run: composer test -- --coverage-clover=runtime/clover.xml

      - name: Upload coverage to Codecov
        continue-on-error: true  # forks have no token
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./runtime/clover.xml

...
