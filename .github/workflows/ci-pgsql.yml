---

on:  # yamllint disable-line rule:truthy
  pull_request: null
  push:
    branches:
      - 1.x

name: Postgres

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  testo:
    name: Postgres, PHP ${{ matrix.php-version }}, ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"
        dependencies:
          - lowest
          - highest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false


      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          extensions: mbstring, pdo, pdo_pgsql

      - name: Install dependencies with composer
        # TODO(cycle/testing): switch to the released package
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Start Postgres
        run: composer db:up -- postgres

      - name: Postgres tests
        env:
          DB_REQUIRED: 1
        run: composer test:postgres

...
